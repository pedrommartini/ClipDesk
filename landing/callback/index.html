<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237146eb'/%3E%3Cpath d='M10 16.5l4 4 8-9' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <title>Conexão concluída — ClipDesk</title>
  <style>
    :root{color-scheme:light;--ink:#17131f;--soft:#5b5468;--violet:#7146eb;--violet-dark:#4f28bd;--line:#e7e1f0}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:24px;color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif;background:#fcfbff;overflow:hidden}
    body::before,body::after{position:fixed;width:520px;height:520px;border-radius:50%;filter:blur(10px);content:"";pointer-events:none}
    body::before{top:-270px;right:-170px;background:radial-gradient(circle,rgba(167,123,255,.28),transparent 68%)}
    body::after{bottom:-340px;left:-190px;background:radial-gradient(circle,rgba(113,70,235,.18),transparent 70%)}
    main{position:relative;width:min(100%,560px);padding:44px;border:1px solid rgba(113,70,235,.17);border-radius:30px;background:rgba(255,255,255,.82);box-shadow:0 34px 90px rgba(50,31,88,.18);backdrop-filter:blur(18px);text-align:center}
    .brand{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:34px;font-size:18px;font-weight:800}.mark{display:grid;width:38px;height:38px;place-items:center;border-radius:12px;color:white;background:linear-gradient(145deg,#a77bff,#4f28bd);box-shadow:0 10px 25px rgba(79,40,189,.3)}
    .check{display:grid;width:76px;height:76px;margin:0 auto 24px;place-items:center;border-radius:50%;color:#fff;background:linear-gradient(145deg,#8c63f4,#5a31c9);box-shadow:0 16px 36px rgba(90,49,201,.3);animation:arrive .55s cubic-bezier(.2,.9,.25,1.2)}
    .check svg{width:36px}.check path{stroke-dasharray:32;stroke-dashoffset:32;animation:draw .45s .32s ease-out forwards}
    h1{margin:0 0 12px;font-size:clamp(28px,6vw,40px);letter-spacing:-.04em}p{max-width:410px;margin:0 auto;color:var(--soft);font-size:16px;line-height:1.65}.status{display:inline-flex;align-items:center;gap:8px;margin-top:27px;padding:9px 13px;border:1px solid var(--line);border-radius:999px;color:var(--violet-dark);background:#f8f5ff;font-size:13px;font-weight:750}.dot{width:7px;height:7px;border-radius:50%;background:#34a984;box-shadow:0 0 0 5px rgba(52,169,132,.1)}
    a{display:inline-block;margin-top:23px;color:var(--violet-dark);font-size:14px;font-weight:750;text-decoration:none}a:hover{text-decoration:underline}
    @keyframes arrive{from{opacity:0;transform:scale(.72) rotate(-9deg)}to{opacity:1;transform:none}}@keyframes draw{to{stroke-dashoffset:0}}
    @media(max-width:520px){main{padding:34px 24px;border-radius:24px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <div class="brand"><span class="mark">C</span><span>ClipDesk</span></div>
    <div class="check" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="m8 16.5 5.2 5.2L24.5 10" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h1 id="title">Tudo certo por aqui.</h1>
    <p>Sua conta foi conectada com segurança. Você já pode fechar esta guia e continuar no ClipDesk.</p>
    <div class="status"><span class="dot"></span>Conexão concluída</div><br />
    <a href="/">Voltar para o site do ClipDesk</a>
  </main>
</body>
</html>
